<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <style>
        :root {
            --bg: #111111;
            --fg: #eeeeee;
            --accent: #2e7d32;
            --accent-hover: #388e3c;
            --border: #333333;
        }

        body {
            width: 240px;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--fg);
            margin: 0;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 18px;
            margin: 0;
            font-weight: 600;
            background: linear-gradient(135deg, #fff 0%, #aaa 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .toggle-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-radius: 12px;
            background: #1a1a1a;
            border: 1px solid var(--border);
            transition: border-color 0.2s;
        }

        .toggle-container:hover {
            border-color: #444;
        }

        .label {
            font-size: 14px;
            font-weight: 500;
        }

        /* Switch styling */
        .switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 22px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #333;
            transition: .3s;
            border-radius: 22px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked+.slider {
            background-color: var(--accent);
        }

        input:focus+.slider {
            box-shadow: 0 0 1px var(--accent);
        }

        input:checked+.slider:before {
            transform: translateX(18px);
        }

        .footer {
            margin-top: 16px;
            font-size: 11px;
            color: #666;
            text-align: center;
        }

        #favoriteModel {
            background: #111;
            border: 1px solid var(--border);
            color: var(--fg);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
            box-sizing: border-box;
            width: 100%;
            cursor: pointer;
        }

        #favoriteModel:focus {
            border-color: var(--accent);
        }

        #getModelsBtn {
            background: var(--accent);
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            width: 100%;
            margin-top: 4px;
        }

        #getModelsBtn:hover {
            background: var(--accent-hover);
        }

        #getModelsBtn:disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>PlexiEnhancer</h1>
    </div>
    <div class="toggle-container" title="Hide citation markers and inline references from Perplexity answers">
        <span class="label">Hide citations in UI</span>
        <label class="switch">
            <input type="checkbox" id="hideCitationsToggle">
            <span class="slider"></span>
        </label>
    </div>
    <div class="toggle-container" style="margin-top: 12px;" title="Hide the Computer setup advertisement box from the bottom right of the page">
        <span class="label">Remove computer ads</span>
        <label class="switch">
            <input type="checkbox" id="removeComputerAdsToggle">
            <span class="slider"></span>
        </label>
    </div>
    <div class="setting-container" style="display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 12px; background: #1a1a1a; border: 1px solid var(--border); transition: border-color 0.2s; margin-top: 12px;">
        <label for="favoriteModel" style="font-size: 14px; font-weight: 500; color: var(--fg);">Favorite Model</label>
        <select id="favoriteModel" title="Your favorite model">
            <option value="">No models loaded</option>
        </select>
        <button type="button" id="getModelsBtn" title="Scrape and retrieve available models from Perplexity">Get Models</button>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 4px; padding-top: 8px; border-top: 1px solid var(--border);" title="Select the favorite model in new tabs. A model you pick by hand always wins for that tab.">
            <span class="label" style="font-size: 13px; font-weight: 500; color: var(--fg);">Apply favorite model</span>
            <label class="switch">
                <input type="checkbox" id="applyFavoriteModelToggle">
                <span class="slider"></span>
            </label>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 4px; padding-top: 8px; border-top: 1px solid var(--border);" title="If Perplexity resets the model you picked by hand in a tab, switch back to it.">
            <span class="label" style="font-size: 13px; font-weight: 500; color: var(--fg);">Keep tab's manual pick</span>
            <label class="switch">
                <input type="checkbox" id="keepTabModelToggle">
                <span class="slider"></span>
            </label>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 4px; padding-top: 8px; border-top: 1px solid var(--border);" title="Turn thinking on when the current model supports it. If you turn it off by hand, that tab is left alone.">
            <span class="label" style="font-size: 13px; font-weight: 500; color: var(--fg);">Enforce thinking</span>
            <label class="switch">
                <input type="checkbox" id="enforceThinkingToggle">
                <span class="slider"></span>
            </label>
        </div>
    </div>
    <div class="footer" style="margin-top: 16px; font-size: 11px; color: #666; text-align: center;">
        Clean answers, better copying, and the model you prefer.
    </div>
    <script src="popup.js"></script>
</body>

</html>
